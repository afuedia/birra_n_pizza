<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Icon Mark: Beer Mug & Pizza Slice fusion -->
  <g transform="translate(4, 4)">
    <!-- Beer mug body -->
    <rect x="8" y="14" width="26" height="34" rx="4" fill="#D97706" fill-opacity="0.15" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Beer foam head -->
    <path d="M6 14C6 9.5 9.5 8 13 8C15 5.5 18.5 5 21 7C23.5 5 27 5.5 29 8C32 8 35 10 35 14Z" fill="#FBF9F5" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Mug handle -->
    <path d="M34 20H42C44.2 20 46 21.8 46 24V38C46 40.2 44.2 42 42 42H34" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Mug vertical grooves -->
    <line x1="16" y1="20" x2="16" y2="40" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="20" x2="24" y2="40" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Overlapping Pizza slice -->
    <path d="M26 18L50 48H18L26 18Z" fill="#C2410C" fill-opacity="0.2" stroke="none"/>
    <path d="M24 16L52 50H18L24 16Z" fill="#FFF8F5" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Pizza crust top -->
    <path d="M18 50C26 53 44 53 52 50" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
    <!-- Pepperoni/toppings dots -->
    <circle cx="28" cy="30" r="3" fill="#C2410C" stroke="#1C1917" stroke-width="1.5"/>
    <circle cx="38" cy="40" r="3" fill="#C2410C" stroke="#1C1917" stroke-width="1.5"/>
    <circle cx="27" cy="42" r="2.5" fill="#D97706" stroke="#1C1917" stroke-width="1.5"/>
  </g>
  <!-- Wordmark typography -->
  <text x="68" y="32" font-family="'Oswald', sans-serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#1C1917" text-transform="uppercase">BIRRA <tspan fill="#C2410C">N</tspan> PIZZA</text>
  <text x="69" y="48" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#78716C" text-transform="uppercase">Cerveza Artesana &amp; Masa Madre</text>
</svg>